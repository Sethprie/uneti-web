<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d1f4f"/></marker>
  <marker id="arrow-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4570c"/></marker>
  <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00727c"/></marker>
</defs>
<rect x="1" y="1" width="998" height="398" rx="18" fill="#f4f6fb" stroke="#dfe4ef" stroke-width="2"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#0d1f4f" text-anchor="start">El camino de un cambio</text><text x="40" y="80" font-size="15" font-weight="400" fill="#4b587a" text-anchor="start">De izquierda a derecha: así llega lo que editas hasta GitHub.</text><rect x="40" y="130" width="180" height="130" rx="14" fill="#ffffff" stroke="#0d1f4f" stroke-width="2"/><text x="130" y="170" font-size="18" font-weight="700" fill="#0d1f4f" text-anchor="middle">Tu carpeta</text><text x="130" y="206" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">Los archivos</text><text x="130" y="228" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">que estás editando</text><line x1="226" y1="195" x2="274" y2="195" stroke="#f4570c" stroke-width="3" marker-end="url(#arrow-o)"/><rect x="210.62" y="98" width="84.75999999999999" height="30" rx="15" fill="#f4570c"/><text x="253" y="118" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">git add</text><rect x="280" y="130" width="180" height="130" rx="14" fill="#ffffff" stroke="#0d1f4f" stroke-width="2"/><text x="370" y="170" font-size="18" font-weight="700" fill="#0d1f4f" text-anchor="middle">Preparados</text><text x="370" y="206" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">Lo que irá en</text><text x="370" y="228" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">el próximo commit</text><line x1="466" y1="195" x2="514" y2="195" stroke="#f4570c" stroke-width="3" marker-end="url(#arrow-o)"/><rect x="437.6" y="98" width="110.8" height="30" rx="15" fill="#f4570c"/><text x="493" y="118" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">git commit</text><rect x="520" y="130" width="180" height="130" rx="14" fill="#ffffff" stroke="#0d1f4f" stroke-width="2"/><text x="610" y="170" font-size="18" font-weight="700" fill="#0d1f4f" text-anchor="middle">Historial</text><text x="610" y="206" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">Tus commits,</text><text x="610" y="228" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">en tu computadora</text><line x1="706" y1="195" x2="754" y2="195" stroke="#f4570c" stroke-width="3" marker-end="url(#arrow-o)"/><rect x="686.28" y="98" width="93.44" height="30" rx="15" fill="#f4570c"/><text x="733" y="118" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">git push</text><rect x="760" y="130" width="180" height="130" rx="14" fill="#ffffff" stroke="#00727c" stroke-width="3"/><text x="850" y="170" font-size="18" font-weight="700" fill="#00727c" text-anchor="middle">GitHub</text><text x="850" y="206" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">La copia</text><text x="850" y="228" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">en internet</text><path d="M850,266 V320 H138" fill="none" stroke="#00727c" stroke-width="3" marker-end="url(#arrow-t)"/><line x1="130" y1="320" x2="130" y2="270" stroke="#00727c" stroke-width="3" marker-end="url(#arrow-t)"/><rect x="453.28" y="308" width="93.44" height="30" rx="15" fill="#00727c"/><text x="500" y="328" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">git pull</text><text x="500" y="364" font-size="14" font-weight="400" fill="#4b587a" text-anchor="middle">Trae a tu carpeta los cambios nuevos que haya en GitHub.</text>
</svg>
