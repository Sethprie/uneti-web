<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d1f4f"/></marker>
  <marker id="arrow-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4570c"/></marker>
  <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00727c"/></marker>
</defs>
<rect x="1" y="1" width="898" height="288" rx="18" fill="#f4f6fb" stroke="#dfe4ef" stroke-width="2"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#0d1f4f" text-anchor="start">El historial de un proyecto con Git</text><text x="40" y="80" font-size="15" font-weight="400" fill="#4b587a" text-anchor="start">Cada punto es un commit: una foto del proyecto con un mensaje que explica qué cambió.</text><line x1="90" y1="160" x2="810" y2="160" stroke="#0d1f4f" stroke-width="4" stroke-linecap="round"/><circle cx="125" cy="160" r="15" fill="#0d1f4f" stroke="#ffffff" stroke-width="4"/><text x="125" y="205" font-size="14" font-weight="600" fill="#00727c" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">a1f3c09</text><text x="125" y="230" font-size="15" font-weight="600" fill="#0d1f4f" text-anchor="middle">Crea la guía del campus</text><circle cx="340" cy="160" r="15" fill="#0d1f4f" stroke="#ffffff" stroke-width="4"/><text x="340" y="205" font-size="14" font-weight="600" fill="#00727c" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">7be2d41</text><text x="340" y="230" font-size="15" font-weight="600" fill="#0d1f4f" text-anchor="middle">Añade cómo entrar</text><circle cx="555" cy="160" r="15" fill="#0d1f4f" stroke="#ffffff" stroke-width="4"/><text x="555" y="205" font-size="14" font-weight="600" fill="#00727c" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">c90e5aa</text><text x="555" y="230" font-size="15" font-weight="600" fill="#0d1f4f" text-anchor="middle">Corrige el enlace de tickets</text><circle cx="770" cy="160" r="15" fill="#f4570c" stroke="#ffffff" stroke-width="4"/><text x="770" y="205" font-size="14" font-weight="600" fill="#00727c" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">ec84d4c</text><text x="770" y="230" font-size="15" font-weight="600" fill="#0d1f4f" text-anchor="middle">Añade horario de la biblioteca</text><rect x="689.49" y="105" width="161.02" height="29" rx="14.5" fill="#f4570c"/><text x="770" y="124" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">tu versión actual</text><text x="120" y="122" font-size="13" font-weight="400" fill="#4b587a" text-anchor="middle">más antiguo</text><text x="450" y="268" font-size="14" font-weight="400" fill="#4b587a" text-anchor="middle">Puedes volver a cualquier punto, ver quién cambió qué y cuándo.</text>
</svg>
