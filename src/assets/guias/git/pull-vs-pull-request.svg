<rect x="1" y="1" width="938" height="298" rx="18" fill="#f4f6fb" stroke="#dfe4ef" stroke-width="2"/>
<text x="470" y="52" font-size="21" font-weight="700" fill="#0d1f4f" text-anchor="middle">Se parecen en el nombre, pero no tienen nada que ver</text><rect x="40" y="82" width="420" height="190" rx="14" fill="#ffffff" stroke="#00727c" stroke-width="3"/><rect x="200.8" y="103" width="98.4" height="31" rx="15.5" fill="#00727c"/><text x="250" y="124" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">git pull</text><text x="130" y="172" font-size="15" font-weight="700" fill="#0d1f4f" text-anchor="middle">GitHub</text><line x1="200" y1="167" x2="290" y2="167" stroke="#00727c" stroke-width="3" marker-end="url(#arrow-t)"/><text x="370" y="172" font-size="15" font-weight="700" fill="#0d1f4f" text-anchor="middle">Tu computadora</text><text x="250" y="220" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">Traes cambios a tu computadora.</text><text x="250" y="244" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">Lo haces tú, con un comando.</text><rect x="480" y="82" width="420" height="190" rx="14" fill="#ffffff" stroke="#f4570c" stroke-width="3"/><rect x="622.2" y="103" width="135.6" height="31" rx="15.5" fill="#f4570c"/><text x="690" y="124" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">Pull request</text><text x="570" y="172" font-size="15" font-weight="700" fill="#0d1f4f" text-anchor="middle">Tu copia</text><line x1="640" y1="167" x2="730" y2="167" stroke="#f4570c" stroke-width="3" marker-end="url(#arrow-o)"/><text x="810" y="172" font-size="15" font-weight="700" fill="#0d1f4f" text-anchor="middle">Proyecto original</text><text x="690" y="220" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">Pides que acepten tus cambios.</text><text x="690" y="244" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">Lo revisa otra persona, en GitHub.</text>
