<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d1f4f"/></marker>
  <marker id="arrow-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4570c"/></marker>
  <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00727c"/></marker>
</defs>
<rect x="1" y="1" width="938" height="438" rx="18" fill="#f4f6fb" stroke="#dfe4ef" stroke-width="2"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#0d1f4f" text-anchor="start">Cómo se contribuye a un proyecto ajeno</text><text x="40" y="80" font-size="15" font-weight="400" fill="#4b587a" text-anchor="start">No puedes escribir directo en el proyecto original, así que trabajas en tu copia (fork).</text><rect x="40" y="120" width="340" height="110" rx="14" fill="#ffffff" stroke="#0d1f4f" stroke-width="3"/><text x="210" y="158" font-size="17" font-weight="700" fill="#0d1f4f" text-anchor="middle">Proyecto original</text><text x="210" y="190" font-size="15" font-weight="600" fill="#00727c" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">Sethprie/uneti-web</text><text x="210" y="214" font-size="14" font-weight="400" fill="#4b587a" text-anchor="middle">en GitHub</text><rect x="560" y="120" width="340" height="110" rx="14" fill="#ffffff" stroke="#f4570c" stroke-width="3"/><text x="730" y="158" font-size="17" font-weight="700" fill="#0d1f4f" text-anchor="middle">Tu copia (fork)</text><text x="730" y="190" font-size="15" font-weight="600" fill="#00727c" text-anchor="middle" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">tu-usuario/uneti-web</text><text x="730" y="214" font-size="14" font-weight="400" fill="#4b587a" text-anchor="middle">en GitHub</text><rect x="560" y="320" width="340" height="90" rx="14" fill="#ffffff" stroke="#0d1f4f" stroke-width="2"/><text x="730" y="358" font-size="17" font-weight="700" fill="#0d1f4f" text-anchor="middle">Tu computadora</text><text x="730" y="386" font-size="14" font-weight="400" fill="#4b587a" text-anchor="middle">donde editas y haces commits</text><line x1="390" y1="150" x2="548" y2="150" stroke="#0d1f4f" stroke-width="3" marker-end="url(#arrow)"/><rect x="429.79" y="119" width="80.42" height="29" rx="14.5" fill="#0d1f4f"/><text x="470" y="138" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">1. Fork</text><line x1="690" y1="240" x2="690" y2="310" stroke="#0d1f4f" stroke-width="3" marker-end="url(#arrow)"/><text x="680" y="282" font-size="14" font-weight="600" fill="#0d1f4f" text-anchor="end" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">2. git clone</text><line x1="770" y1="310" x2="770" y2="240" stroke="#f4570c" stroke-width="3" marker-end="url(#arrow-o)"/><text x="780" y="282" font-size="14" font-weight="600" fill="#f4570c" text-anchor="start" font-family="'Cascadia Mono', Consolas, 'DejaVu Sans Mono', Menlo, monospace">3. git push</text><line x1="548" y1="205" x2="390" y2="205" stroke="#00727c" stroke-width="3" marker-end="url(#arrow-t)"/><rect x="397.55" y="215" width="144.9" height="29" rx="14.5" fill="#00727c"/><text x="470" y="234" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">4. Pull request</text><text x="210" y="300" font-size="14" font-weight="400" fill="#4b587a" text-anchor="middle">Quien mantiene el proyecto</text><text x="210" y="322" font-size="14" font-weight="400" fill="#4b587a" text-anchor="middle">revisa tu propuesta y, si está</text><text x="210" y="344" font-size="14" font-weight="400" fill="#4b587a" text-anchor="middle">bien, la une al original.</text>
</svg>
