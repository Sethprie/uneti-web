<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d1f4f"/></marker>
  <marker id="arrow-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f4570c"/></marker>
  <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00727c"/></marker>
</defs>
<rect x="1" y="1" width="898" height="338" rx="18" fill="#f4f6fb" stroke="#dfe4ef" stroke-width="2"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#0d1f4f" text-anchor="start">Git y GitHub no son lo mismo</text><rect x="40" y="90" width="330" height="200" rx="14" fill="#ffffff" stroke="#0d1f4f" stroke-width="2"/><text x="205" y="128" font-size="18" font-weight="700" fill="#0d1f4f" text-anchor="middle">Tu computadora</text><rect x="179.05" y="143" width="51.9" height="31" rx="15.5" fill="#f4570c"/><text x="205" y="164" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">Git</text><text x="205" y="205" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">La herramienta que guarda</text><text x="205" y="227" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">el historial de tu carpeta.</text><text x="205" y="262" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">Funciona sin internet.</text><rect x="530" y="90" width="330" height="200" rx="14" fill="#ffffff" stroke="#00727c" stroke-width="2"/><text x="695" y="128" font-size="18" font-weight="700" fill="#0d1f4f" text-anchor="middle">Internet</text><rect x="603.95" y="143" width="182.1" height="31" rx="15.5" fill="#00727c"/><text x="695" y="164" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="'Segoe UI', Inter, system-ui, Arial, sans-serif">GitHub  ·  GitLab</text><text x="695" y="205" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">Sitios que guardan una copia</text><text x="695" y="227" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">del proyecto para compartirlo</text><text x="695" y="249" font-size="15" font-weight="400" fill="#4b587a" text-anchor="middle">y colaborar con otras personas.</text><line x1="385" y1="165" x2="515" y2="165" stroke="#0d1f4f" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="152" font-size="14" font-weight="700" fill="#0d1f4f" text-anchor="middle">subir</text><line x1="515" y1="215" x2="385" y2="215" stroke="#00727c" stroke-width="3" marker-end="url(#arrow-t)"/><text x="450" y="240" font-size="14" font-weight="700" fill="#00727c" text-anchor="middle">traer</text><text x="450" y="320" font-size="14" font-weight="400" fill="#4b587a" text-anchor="middle">Lo que aprendas de Git te sirve igual en GitHub, GitLab o cualquier otro sitio.</text>
</svg>
